  # Rev B per dimension-audit agent: only the LEFT/inside-corner downpipe
  # is actually visible in any photograph or PDF.  A "right" downpipe was
  # assumed in error.
  downpipe_rear_wall_left:
    # Cast-iron downpipe on the REAR wall — LEFT inside-corner.
    # Visible in photo 14 (LEFT edge of the rear-wall view — in the L corner).
    diameter_mm: 90
    material: "cast iron, black-painted"
    position_from_east_corner_mm: 250     # close to the left edge of the rear wall
    _status_position: "TBC: estimated from photo 14 — sits in the inside corner of the L."
    swan_neck_height_above_slab_mm: 3200
    note: |
      Existing downpipe in the inside corner of the L.  The proposed spiral
      staircase sits IN this corner, so this downpipe may need to be
      rerouted/relocated to make space for the staircase base-plate and
      tread envelope.  CONFIRM ON SITE.

# -----------------------------------------------------------------------------
# PROPOSED CHANGES — REAR / COURTYARD ELEVATION
# -----------------------------------------------------------------------------
proposed:
  # SIDE WALL UPPER: kitchen window converted to doorway
  side_wall_upper_doorway:
    threshold_level_above_kitchen_ffl_mm: 0        # door drops to kitchen-floor level
    threshold_level_above_courtyard_slab_mm: 2820  # i.e. door head must equal staircase top of landing
    head_height_above_kitchen_ffl_mm: 2050         # match existing window head
    clear_width_mm: 800                            # 80 cm clear doorway (sufficient for access)
    _status_width: "Subject to making-good and structural opening; pending engineer review."
    _drop_amount_mm: 720
    _drop_note: |
      Grahame's email referred to "approximately 400 mm" of extension.  In
      practice, a doorway needs the sill all the way down to FFL = 720 mm
      drop, not 400 mm.  Treating 400 mm as Grahame's initial estimate and
      using 720 mm to give a functional door.
    door_style: "Vertically-proportioned 2-pane glazed timber door, white painted, with traditional reveal and slate threshold; head to match existing window head height for continuity."
    making_good: "Match existing brick reveals; new red-brick flat arch / lintel detail to match the 1230 mm window below."
  # SIDE WALL LOWER: bricked-up opening reinstated
  side_wall_lower_reinstated_window:
    opening_width_mm: 600
    opening_height_mm: 1600
    sill_height_above_slab_mm: 900
    style: "Vertically-proportioned multi-pane sash, matching the 1230 mm window beside it in style, sill/head detail and finish."
    note: "Reinstatement of previously blocked-up opening — historic fabric strongly suggests it was always glazed."
  # REAR WALL UPPER: rear-reception window stays (no change in v1)
  rear_wall_upper_window:
    change: "Retain as existing (no change in v1)."
  # REAR WALL LOWER: double-door bay reconfigured?
  rear_wall_lower_doors:
    change: "Retain as existing double-door access from courtyard to lower-basement (no change in v1)."
  # SERVICES rationalised
  downpipe:
    new_position_from_north_corner_mm: 2950
    note: "Re-route downpipe to clear the new doorway / staircase landing. Maintain black-painted cast iron character."
  # SPIRAL STAIRCASE installed in inside corner of L
  staircase_installation:
    position: "Inside corner of the L (where side wall meets rear wall) within the courtyard"
    centre_distance_from_side_wall_mm: 950
    centre_distance_from_rear_wall_mm: 950
    top_landing_level_above_courtyard_slab_mm: 2820   # = kitchen FFL
    base_fixing: "Steel base-plate bolted to courtyard slab; final detail by engineer."
    top_fixing: "Side-fixed to side wall + propped from staircase centre pole; final detail by engineer."

# -----------------------------------------------------------------------------
# SPIRAL STAIRCASE (reclaimed Victorian cast iron) — physical artefact
# -----------------------------------------------------------------------------
spiral_staircase:
  # Corrected Rev B: slab-to-FFL is 3000 mm (not 2820), so risers must take
  # 3000 mm rise.  Grahame counted 15 pads — interpret as 15 risers ×
  # 200 mm = 3000 mm exactly (or 14 risers × 214 mm).  Adopting 15 × 200.
  n_treads: 15                       # 15 risers carrying the 3000 mm rise
  _note_treads: |
    Grahame counted 15 pads.  In Rev B with slab-to-FFL = 3000 mm, the
    cleanest fit is 15 risers × 200 mm = 3000 mm exactly.  Top tread
    becomes the landing pad meeting the kitchen-doorway threshold.
  tread_rise_mm: 200                 # 15 × 200 = 3000 mm = slab-to-FFL
  total_rise_mm: 3000
  central_pole_height_mm: 3300       # extends above landing as handrail post
  central_pole_diameter_mm: 90
  outer_radius_mm: 800               # 80 cm projection (Grahame)
  envelope_radius_mm: 875            # ~175 cm overall diameter
  tread_widest_mm: 340
  tread_thickness_mm: 30
  # Setting-out (Rev B fix): user must EXIT facing the kitchen doorway,
  # which is on the EAST side wall (in plan: +x direction from staircase
  # centre).  With 15 risers we tune the rotation so the top tread
  # presents its outer edge eastward.  Choosing 24°/tread → 15×24°=360°
  # full revolution: enter and exit at the same compass angle.  We set
  # entry tread on south side (azimuth 270° in math convention) so the
  # user steps in from the courtyard slab facing the kitchen; the
  # spiral winds clockwise (descending angle) and the top tread
  # presents east-facing.
  rotation_per_tread_deg: 24         # 15 × 24 = 360° full revolution
  start_angle_deg: 270               # first tread faces south (into courtyard)
  spiral_direction: "clockwise (viewed from above; descending angle)"
  finish: "dark painted cast iron, black ironwork"
  handrail_height_mm: 900
  # Position in the courtyard plan: centred 950 mm from each of side & rear walls
  centre_position_mm:
    from_side_wall: 950
    from_rear_wall: 950

# -----------------------------------------------------------------------------
# INTERNAL: FRONT LOUNGE + REAR RECEPTION
# Ground floor; ceiling 3.28 m.
# -----------------------------------------------------------------------------
front_lounge:
  # CORRECTED Rev B: 4340 is the FLAT envelope (front-back), NOT room width.
  # Front lounge ROOM width per Grahame ~2650 mm (the "265 cm total" wall).
  # Hallway eats into this side.
  room_width_mm: 2650               # internal room width (NS in plan)
  fireplace_wall_breakdown_mm: [1900, 1800, 1900]   # 190 / 180 / 190 around fireplace
  # Grahame's far-left wall: "70 cm + 112 cm cut-out + 265 cm TOTAL"
  far_left_wall_breakdown_mm: [700, 1120, 830]      # 700 + 1120 + 830 = 2650
  far_left_wall_total_mm: 2650
  ceiling_mm: 3280

rear_reception:
  # Rear reception is ~35 cm wider than front (Grahame): 2650 + 350 = 3000 mm.
  room_width_mm: 3000
  side_wall_breakdown_mm: [650, 1120, 1500]         # 60-70 / 112 / 150
  dividing_wall_thickness_mm: 100                   # 10 cm internal wall
  fireplace_wall_breakdown_mm: [1450, 1840, 1460]   # 145 / 184(fireplace) / 146
  rear_wall_window_offset_mm: 400                   # 40 cm side-wall-to-window
  rear_wall_window_width_mm: 2100
  rear_wall_window_end_pier_mm: 700                 # 70 cm to end of wall beyond window
  width_difference_from_front_mm: 350               # rear ~35 cm wider than front
  ceiling_mm: 3280

internal_opening_between_rooms:
  # Wall between front lounge and rear reception; the OPENING width must
  # fit within the front-lounge width 2650 mm (the narrower room).
  location: "Wall between front lounge and rear reception"
  wall_thickness_mm: 100
  existing:
    approx_width_mm: 1120        # the 112 cm cut-out Grahame measured
    approx_height_mm: 2100
    _status: "TBC: as-found opening dims; tape-measure required."
  proposed:
    nib_left_mm: 700                                # 70 cm retained nib (Grahame)
    nib_right_mm: 600                               # 60 cm retained nib (Grahame)
    height_mm: 2950                                 # 290-300 cm head (Grahame)
    # Corrected Rev B: clear = front_lounge.room_width - nib_left - nib_right
    # = 2650 - 700 - 600 = 1350 mm
    clear_width_mm: 1350
    _clear_width_calculation: |
      front_lounge.room_width_mm (2650) − nib_left (700) − nib_right (600)
      = 1350 mm clear opening.  Centred on the lounge ⇒ slightly offset
      relative to the rear reception (which is 350 mm wider).
    structural_note: "Subject to structural engineer design — steel beam with end pad-stones; final size & padstone widths by engineer."
    making_good: "Make good plaster, skirting, cornicing and ceiling to match existing period detail to both rooms."

