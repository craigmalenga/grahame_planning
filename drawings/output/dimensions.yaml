      900 + 100 + 500 + 100 + 400 + 100 + 400 = 2500 mm exactly within
      the 2500 mm available wall run.  Three 100 mm partition walls.
  door_type: "Pocket / sliding door"
  pocket_door_clear_opening_mm: 700
  glazed_doors_available:
