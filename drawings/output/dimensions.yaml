# Flat 1, 20 Hornton Street, London W8 4NR
# Measured / proposed dimensions for planning drawings
#
# ALL DIMENSIONS IN MILLIMETRES (mm) unless noted otherwise.
#
# Sources of truth (in priority order):
#   1. job16873-1.pdf  (Real Estate Services, surveyed 12/2/2026 for HM Land Registry)
#      - This is the only authoritative measured plan of No. 20 itself.
#   2. Grahame Pearce's site measurements (read_me.,md and the Re_... .msg emails)
#      - On-site tape-measure dimensions of openings, walls, the rear elevation,
#        the courtyard, the spiral staircase, and the proposed bathroom.
#   3. Photo analysis (photo_analysis.md) + Craig's verbal clarifications.
#   4. Comparable applications — No. 24 (Savills 2007) and No. 30 (Rawspace 2014)
#      Hornton Street — used only as precedent / typology references, NOT as
#      dimensional source for No. 20.
#
# Edit any value here, then run `python3 drawings/src/render_all.py` to
# regenerate every drawing.  Items marked "_status: TBC" are placeholders
# pending site re-measure or clarification from Grahame.

project:
  title: "Flat 1, 20 Hornton Street, London W8 4NR"
  client: "Grahame McGirr"
  borough: "Royal Borough of Kensington and Chelsea"
  conservation_area: "Kensington Conservation Area (to confirm)"
  listed_building: true   # Grade II terrace — to confirm via RBKC list
  rev: "B"
  status: "FOR PLANNING — DRAFT"
  orientation_note: |
    The dwelling's REAR wall (the one with the door bay) faces NE — per
    Craig's confirmation 2026-05-25.  Plans therefore show N rotated ~45°
    relative to the drawing's up direction.  Elevations do not show N
    arrows (the elevation is a vertical projection; up = sky).

# -----------------------------------------------------------------------------
# OVERALL FLAT ENVELOPE (from job16873-1)
# -----------------------------------------------------------------------------
flat_envelope:
  basement:
    length_mm: 19060          # 19.06 m front-to-back (incl. vaults under pavement)
    width_mm: 5700            # 5.70 m
    ceiling_heights_mm:
      front_room: 2820        # patio area
      bedrooms: 2760
      rear_room: 2760
      rear_basement_under_kitchen: 1890   # the small low-ceiling space
  ground_floor:
    length_mm: 13770          # 13.77 m (shorter than basement — no vaults)
    width_mm: 4340            # 4.34 m
    ceiling_heights_mm:
      front_lightwell_zone: 2450
      front_lounge: 3280
      rear_reception: 3280
      kitchen: 2450
  total_storeys: 2            # Flat 1 = basement + ground

# -----------------------------------------------------------------------------
# REAR COURTYARD / LIGHTWELL
# Sits at the rear-left of the ground-floor plan.  Open above to sky.
# Bordered by:
#   - SOUTH side (inward, toward dwelling): the wall to the rear reception room.
#     Called the "REAR wall" here.  Contains the large rear-reception sash
#     window (upper) + the recessed double-door bay (lower-basement).
#   - EAST side (inward, toward kitchen): the wall to the kitchen.
#     Called the "SIDE wall" / "LEFT wall" (as named by Craig and Grahame
#     when standing in the courtyard looking back at the building).
#     Contains the kitchen window (upper, ground floor) + two basement-level
#     windows (60 cm bricked-up + 123 cm glass) at lower level.
#   - WEST side: party / boundary wall with No. 22 — assumed solid brick, no
#     openings.
#   - NORTH side: rear property boundary — solid brick wall to ~3.5 m height.
# -----------------------------------------------------------------------------
courtyard:
  plan_width_mm: 3250         # east-west, between boundary and kitchen wall (= 325 cm Grahame)
  plan_depth_mm: 2950         # north-south, between rear-reception wall and rear boundary (= 295 cm Grahame)
  # CORRECTED in Rev B per dimension-audit agent:
  #   Grahame's own sill measurements give 3720 mm (kitchen) and 3800 mm
  #   (rear) above the courtyard slab.  With internal sills at 720/800 mm
  #   above FFL the implied slab-to-FFL is ~3000 mm — NOT 2820 mm (which
  #   was the basement ceiling height, a different dimension).
  slab_to_gf_ffl_mm: 3000     # courtyard slab to ground-floor FFL (re-derived)
  _status_slab_to_ffl: "Re-derived from Grahame's measured sill heights; confirm on site."
  white_paint_datum_mm: 2900  # height of white-paint line on courtyard brickwork (Grahame)
  rear_boundary_wall_height_mm: 3500
  _status_boundary_height: "TBC: 3.5 m quoted in one email; confirm on site."
  surface: "loose brick-dust / gravel over slab — to be made good / paved as part of works"
  drainage_position:
    _status: "TBC: position of gully / rain-water drain in patio not yet surveyed."

# -----------------------------------------------------------------------------
# REAR WALL (south wall of courtyard, ~325 cm wide)
# Lower: recessed double-door bay (basement access from courtyard)
# Upper: large rear-reception sash window (ground floor)
# -----------------------------------------------------------------------------
rear_wall:
  total_width_mm: 3250        # = courtyard width
  lower_basement:
    # CORRECTED per Craig (shared image 14 — re-examined 2026-05-25):
    # The lower-basement opening in the recess is NOT a pair of doors —
    # it is a SINGLE CENTRAL DOOR with a SASH WINDOW each side, all under
    # one red-brick flat arch.  The two flanking side-windows have RAISED
    # BRICK SILLS (so they don't extend all the way to the threshold).
    left_painted_cheek_mm: 700       # 70 cm — adjusted so 700+1850+700=3250 exactly matches courtyard width
    recess_width_mm: 1850            # 185 cm — recess width (door + 2 side windows + reveals)
    right_painted_cheek_mm: 700      # see left cheek note
    _check_arithmetic: "720+1850+720 = 3290 mm (~329 cm) vs. courtyard width 3250 mm. ~4 cm tolerance / wall-thickness rounding."
    # Composition WITHIN the 1850 mm recess (from left to right):
    side_window_width_mm: 465        # each flanking sash — fits (25+465+25+820+25+465+25 = 1850 ✓)
    side_window_raised_sill_height_mm: 600   # brick-sill panel below each side window
    central_door_width_mm: 820       # central single door — per Grahame's "82 cm doorway" email
    inner_reveal_mm: 25              # frame reveal at each end + between
    head_height_above_slab_mm: 2300  # head of door & side-window assembly above courtyard slab
    head_to_white_line_mm: 2900      # 290 cm height of recess at white line (Grahame)
    # Note: head_height < head_to_white_line because there's the flat-arch
    # zone between the door head and the white-line above.
    threshold_level_above_slab_mm: 0
    _status_arithmetic: |
      720 (left painted cheek) + 1850 (recess) + 720 (right painted cheek) = 3290 mm.
      Within the recess: 25 + 450 (LSW) + 25 + 900 (door) + 25 + 450 (RSW) + 25 = 1900 mm.
      Currently 50 mm over recess width — final widths to be re-measured on site.
    _grahame_82cm_note: |
      Grahame's "doorway/opening to balustrade elements 82 cm wide" most
      plausibly refers to the central door clear-opening (with frame closer
      to 90 cm).
    _grahame_72cm_note: |
      Grahame's "two rear doors symmetrical at 72 cm each side" originally
      read as door leaves; per Craig's correction it actually refers to the
      painted-brick cheek width OUTSIDE the recess (72 cm each side).
  upper_ground:
    sash_width_mm: 2100              # 210 cm wide — rear-reception window (Grahame)
    sash_height_mm: 2200             # CORRECTED Rev B (was 2400); head must allow cornice + lintel under 3280 ceiling
    _status_sash_height: |
      Grahame's email said "300-310 cm high"; that would put the head above the
      3280 ceiling, which is impossible.  Plausible interpretation is that
      this dimension is from courtyard slab to head (= 2820 + 80 sill + 2400
      head = 5300 mm, close enough).  Using internal opening height 2400.
      CONFIRM ON SITE.
    sill_height_above_ffl_mm: 800    # 80 cm sill above interior floor (Grahame)
    sill_height_above_courtyard_slab_mm: 3800  # 380 cm (Grahame, from courtyard)
    head_height_above_courtyard_slab_mm: 6200  # = sill + height
    # Per Craig (Rev C+ photo review 2026-05-25): the upper rear-reception
    # sash IS centred in the rear wall (not the 400 mm offset that Grahame's
    # internal-room measurement implied). Centred = (3250-2100)/2 = 575 mm
    # from each end.
    horizontal_position_from_east_corner_mm: 575
    _status_horizontal_position: |
      Rev C+: centred on the 3250 mm rear wall per Craig's photo confirmation.
      Grahame's internal-room "40 cm offset" was measured from the side wall
      INSIDE the rear-reception, which is a different reference.

# -----------------------------------------------------------------------------
# SIDE WALL (east wall of courtyard, ~300 cm long)
# Lower (basement level): TWO windows side-by-side along a 300 cm wall
#   from north to south:  51 + 60(bricked) + 49(pier) + 123(glass) + 17
# Upper (ground floor): ONE glass window — the kitchen window, to be
#   converted into a doorway at the top of the spiral staircase.
# -----------------------------------------------------------------------------
side_wall:
  total_length_mm: 3000              # = 300 cm (51+60+49+123+17 per Grahame)
  _check_arithmetic: "300 cm vs. courtyard depth 295 cm — 5 cm tolerance / wall thickness."
  lower_basement:
    # Origin = north end of wall (rear boundary side). Distances run southward.
    sequence_from_north_mm:
      - { label: "solid brick",          length: 510 }
      - { label: "bricked-up opening",   length: 600,  type: "blocked_window" }
      - { label: "solid brick pier",     length: 490 }
      - { label: "existing window (glass)", length: 1230, type: "window" }
      - { label: "solid brick",          length: 170 }
    both_openings_sill_height_above_slab_mm: 900    # 90 cm sill (Grahame)
    both_openings_height_mm: 1600                   # 160 cm window height (Grahame)
    both_openings_head_height_above_slab_mm: 2500   # 250 cm head — fits under 2760 basement ceiling
  upper_ground:
    # The kitchen window — to be extended/converted to a doorway
    glass_gap_mm: 660                  # 66 cm of actual glass (Grahame)
    structural_recess_width_mm: 900    # wider than glass; _status: TBC final figure
    _status_recess: "Grahame said recess wider than 66 cm but didn't measure. Working estimate 900 mm."
    sill_height_above_kitchen_ffl_mm: 720          # 72 cm sill (Grahame)
    sill_height_above_courtyard_slab_mm: 3720      # 3000 (FFL Rev C) + 720 (sill)
    _status_sill_grahame: |
      Grahame quoted "372 cm" sill height above courtyard slab. Computed 354 cm.
      18 cm discrepancy — likely slab thickness / boundary masonry / rounding.
      Using 3540 as the computed figure for drawing consistency.
    head_height_above_kitchen_ffl_mm: 2050         # _status: TBC; using 2050 to clear under 2450 ceiling
    head_height_above_courtyard_slab_mm: 4870
    horizontal_position_from_north_corner_mm: 2050
    _status_horizontal_position: |
      TBC: Grahame did not state position. Working estimate places the kitchen
      window/doorway near the SOUTH end of the side wall so the new doorway
      aligns vertically with the spiral-staircase centre (which is 950 mm from
      the side wall = 2050 mm from the north corner of the 3000 mm side wall).
      CONFIRM ON SITE.

# -----------------------------------------------------------------------------
# EXISTING SERVICES — to be rationalised
# -----------------------------------------------------------------------------
existing_services:
  downpipe_side_wall:
    # Cast-iron downpipe on the SIDE wall (east wall of courtyard, kitchen-side)
    # Visible in photo 16 + photo 14 (LEFT edge).
    diameter_mm: 90
    material: "cast iron, black-painted"
    position_from_north_corner_mm: 1500
