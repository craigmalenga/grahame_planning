    address: "30 Hornton Street, London W8 4NR"
    notes: |
      Document-0C57AD4F3AEE4AA558DF57C9E0DB2519.pdf and the two
      Document-C747CBFCB817A564F8179992856FB177*.pdf files relate to
      Rawspace's June 2014 LB consent (Ref LB/14/03475) at 30 Hornton Street
      for Ms H. O'Shea — alterations including blocking a door opening,
      removing a chimney-breast wall and forming a structural door opening.
    indicative_dimensions_observed_on_drawings_mm:
      previously_approved_door_elevation_height: 2500
      previously_approved_door_elevation_width: 1560
      proposed_door_elevation_height: 2500
      proposed_door_elevation_breakdown:
        nib_left: 920
        opening_clear: 1365
        nib_right: 1005
        head_to_ceiling: 730
        head_height_above_floor: 1930
    usefulness: "Useful precedent for the SCALE of a similar opening
                 between two reception rooms on Hornton Street."
  - source: savills07
    address: "24 Hornton Street, London W8 4NR"
    notes: |
      Savills (Phillimore 1964 Settlement) April 2007 LB consent application —
      renewal of roof coverings, damp-proofing works to basement & pavement vaults,
      internal refurbishment of Flat 1. Useful precedent on a directly comparable
      adjacent property.
    indicative_dimensions_from_arch_drawing_mm:
      hardwood_screen_arch_chord_width: 1000     # spring of arch on Section A-A
      hardwood_screen_height_above: 375          # over arch
    usefulness: "Floor plan layout (Bedroom 1/2/3, Bath 1/2, Kitchen, Lounge,
                 Pavement vaults) is structurally similar to 20 Hornton St — useful
                 as a planning precedent on the same street."

