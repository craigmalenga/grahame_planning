# ---------------------------------------------------------------------
# DESIGN STRATEGY NOTES (non-dimensional but planning-critical)
# ---------------------------------------------------------------------
design_strategy:
  source: [file1, readme]
  principles:
    - "Retain open rear lightwell — no infill or covering."
    - "Reinstate the bricked-up former window as a window/opening (heritage benefit)."
    - "Convert existing larger rear window into doors using EXISTING lintel/opening width where possible — avoid new openings that disrupt rhythm."
    - "Form a continuous or partial landing/platform along the wall below the window line; spiral staircase rises along the side wall in the corner of the L-shape, not centred in the patio."
    - "Lower-ground existing opening (current double-door arrangement) potentially reformed as a proper pair of doors within existing lintel width."
    - "Rationalise downpipes / external services."
    - "Reclaimed Victorian cast iron spiral staircase, restored in dark / black painted ironwork."
    - "Internal reception-room opening: 60 + 70 cm nibs, 290–300 cm high; subject to structural engineer."
  expressed_concerns_for_chatgpt_failures:
    - "ChatGPT 3D renderings flattened the L-shape courtyard into a single flat wall — incorrect."
    - "Spiral staircase must be in the corner / mid-way between the two perpendicular walls of the L."
    - "Double-door at lower basement has equal clearance to left wall and right wall (not skewed)."
    - "Upper left-hand of L-shape currently has NO window — it is bricked-in; to be opened up as a doorway."

