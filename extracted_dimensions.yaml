# =====================================================================
# Flat 1, 20 Hornton Street, London W8 4NR
# Consolidated dimension schedule for planning / listed building consent
# All values transcribed from source materials in /home/user/grahame_planning/
# Source codes used in citations:
#   readme    = read_me.,md (Craig's compiled notes, with Grahame's quoted text)
#   re_msg5   = "Re_ For what it is worth ... 5.msg" (rear elevation + basement doors)
#   re_msg4   = "Re_ For what it is worth ... 4.msg" (lower ground bathrooms + patio)
#   re_msg3   = "Re_ For what it is worth ... 3.msg" (front lounge + rear reception)
#   re_msg2   = "Re_ For what it is worth ... 2.msg" (kitchen + proposed shower room)
#   re_msg1   = "Re_ For what it is worth ... 1.msg" (spiral staircase summary)
#   file1     = File1.msg (design strategy note - lintels/openings)
#   file3     = File3.msg (Merlyn shower door reference)
#   job16873  = job16873-1.pdf (Real Estate Services surveyed plan, Land Registry submission 12/2/2026)
#   savills07 = "24 hornton street plan 2/3/4 + full application" (Savills 2007 — NB: 24 Hornton St,
#               adjacent/similar property, NOT the subject site; included for context only)
#   rawspace14 = Document-* (Rawspace 2014 listed building consent, 30 Hornton Street — also context only)
# ALL DIMENSIONS APPROXIMATE/AS-MEASURED unless explicitly stated otherwise.
# =====================================================================

property:
  address: "Flat 1, 20 Hornton Street, London W8 4NR"
  listed_status: "Grade II listed (per draft Heritage Statement)"
  conservation_area: "Kensington Conservation Area"
  flat_arrangement: "Lower Ground Floor + Ground Floor maisonette"
  units_note: "Dimensions throughout in cm unless suffixed m or mm."

# ---------------------------------------------------------------------
# Surveyed overall envelope (from Real Estate Services drawing, Feb 2026)
# ---------------------------------------------------------------------
overall_envelope:
  source: job16873
  drawing_ref: "REF 16873, dated 12/2/2026, scale 1:150 on A4 (surveyor MT)"
  total_length_m:
    front_to_back: 19.06       # along long axis, basement
    note: "19.06 m noted along the long basement dimension"
  ground_floor_length_m: 13.77 # noted on ground floor plan
  width_m: 4.34                # internal width across the flat
  ground_floor_heights_m:      # ceiling heights shown on plan
    lightwell_upper_height: 2.45   # over upper / kitchen lightwell area
    front_lounge_height: 3.28      # front reception
    rear_reception_height: 3.28    # rear reception (matches)
    note: "Front and rear reception both 3.28 m floor-to-ceiling"
  basement_heights_m:
    front_patio_height: 2.82
    front_bedroom_height: 2.76
    rear_bedroom_height: 2.76
    vault_height: 1.89
    rear_lightwell_open_height: 5.39  # height marked at the rear lightwell on basement plan
    secondary_lightwell_dim_m: 2.94
    long_dim_5_70: 5.70  # marked between basement spaces
  conflict_note: |
    job16873 records ground-floor reception ceilings at 3.28 m. re_msg3 quotes
    a rear window head height of "approximately 300 cm to 310 cm high" which is
    the WINDOW height, not ceiling height. The 290 cm "white line" in re_msg5
    is a separate datum inside the rear lower-basement opening recess.

# ---------------------------------------------------------------------
# REAR ELEVATION — at ground-floor (kitchen / lightwell) level
# This is the "key planning drawing". Measurements quoted left to right.
# Includes: solid wall, bricked-up former window, pier, existing larger
# window (to be extended down ~400 mm into a door), end of wall.
# ---------------------------------------------------------------------
rear_elevation_ground_floor:
  source: [readme, re_msg5]

  horizontal_sequence_left_to_right_cm:
    - segment: "solid wall (left return)"
      width: 51
    - segment: "bricked-up former window/opening (to be REINSTATED)"
      width: 60
    - segment: "solid pier between openings"
      width: 49
    - segment: "existing larger window (to be EXTENDED ~400 mm down to form door)"
      width: 123
    - segment: "solid wall to right-hand end"
      width: 17
  total_run_check_cm: 300   # 51+60+49+123+17 = 300 (rear elevation horizontal total)

  vertical_geometry_cm:
    height_under_both_sills: 90    # from floor to underside of sill
    both_opening_heights: 160      # both openings (bricked + existing window) 160 cm tall
    sill_level_kitchen_window_to_become_door:
      value: 372
      definition: "height to sill (including the sill itself) from the lower
                   reference level Grahame used (described as 'to sill')"
    sill_level_rear_windows:
      value: 380
      definition: "the other rear windows' sill is roughly 380 cm — about
                   8 cm higher than the kitchen window-to-become-door"
    sill_level_difference_cm: 8

  intended_changes:
    - "Bricked-up former opening (60 cm wide x 160 cm tall) to be reinstated as a window/opening."
    - "Existing larger window (123 cm wide x 160 cm tall, sill at ~372 cm) to be extended downward by approximately 400 mm and converted to a door for spiral-staircase access."
    - "Sill/head/reveal detailing to match surrounding fabric; making-good to masonry."
    - "Rationalise downpipes / external services."

  ambiguity_flags:
    - "372 cm and 380 cm are unusually high numbers — these almost certainly describe height ABOVE the lower-ground patio / lightwell floor (i.e. the sill is ~3.72 m above the basement courtyard level, which is consistent with the staircase rise of ~3.0 m). They are NOT measured from the kitchen floor."
    - "The 51/60/49/123/17 = 300 cm total appears to refer ONLY to the kitchen-rear-wall portion of the elevation, not the full rear elevation of the flat. Confirm with Craig."

# ---------------------------------------------------------------------
# REAR ELEVATION — lower basement (the double doors below)
# This is the bottom of the L-shape, looking at the wider rear doors.
# ---------------------------------------------------------------------
lower_basement_doors:
  source: [readme, re_msg5]
  rear_doors_pair:
    each_leaf_width_cm: 72            # symmetrical, 72 cm each side
    total_door_pair_width_cm: 144     # 72 + 72 (implied)
  sill_height_cm: 80                  # from the basement/courtyard floor
  opening_above_doors_to_balustrade_cm: 82  # "doorway/opening up to the small wooden balustrade elements"
  overall_recess_width_cm: 185        # full rear opening/recess width
  height_to_white_line_above_cm: 290  # internal head / lintel band above
  protruding_wall_note:
    location: "right-hand side, facing rear doors from inside"
    approx_height_above_floor_m: 2.0
    description: "small protruding section of wall higher up — Grahame to send photo"

# ---------------------------------------------------------------------
# REAR PATIO / LIGHTWELL (the L-shaped courtyard)
# ---------------------------------------------------------------------
courtyard:
  source: [readme, re_msg4, re_msg1]
  plan_dimensions_cm:
    width: 325
    depth: 295
  rear_boundary_wall_height_cm: 350
  rear_boundary_wall_purpose_note: "Materially screens the patio from overlooking — relevant to privacy/overlooking assessment in planning."
  shape: "L-shape (NOT a rectangular box). The kitchen/upper level sits at the corner of the L; the wider lower-basement rear doors occupy the longer face."
  key_geometry_intent:
    - "Spiral staircase to sit in the corner of the L-shape, NOT in the middle of a flat wall."
    - "The double doors at lower-basement level have approximately equal clearance left and right (per Craig's correction to ChatGPT)."
    - "The upper-floor left side of the L (kitchen end) currently has the bricked-in opening below and existing window above — the planning intent converts the upper to a doorway."

# ---------------------------------------------------------------------
# RECEIVED RISE / SPIRAL STAIRCASE
# ---------------------------------------------------------------------
spiral_staircase:
  source: [readme, re_msg1]
  origin: "Reclaimed Victorian cast iron, dark / black painted finish"
  treads_count_approx: 15
  tread_rise_mm: [200, 210]   # 200-210 mm per tread
  estimated_total_rise_m: [3.00, 3.15]
  central_pole_height_m: 3.3
  tread_projection_cm: 80     # from inner pole to outer edge
  tread_diagonal_depth_cm: [80, 85]
  tread_width_at_widest_cm: 34
  external_diameter_cm: 160
  practical_circular_envelope_cm: [165, 170]
  recommended_layout_envelope_cm: [170, 175]
  required_rise_assumption_m: [2.9, 3.1]
  fits_within_courtyard_check:
    courtyard_w_cm: 325
    courtyard_d_cm: 295
    note: "Fits geometrically; needs site-test against new door, drainage, wall clearances, landing height."
  notes:
    - "If actual rise differs from staircase length, allow for small plinth / landing piece."
    - "Treat top connection as needing a landing/platform if it does not exactly meet threshold."

# ---------------------------------------------------------------------
# INTERNAL OPENING between front and rear reception rooms
# ---------------------------------------------------------------------
internal_opening_reception_rooms:
