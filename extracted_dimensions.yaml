      one_side: 70
      other_side: 60
    proposed_opening_height_cm: [290, 300]  # "290 to 3 m height"
    structural_note: "Beam / lintel zone subject to structural engineer design and Building Control approval."
  context_geometry:
    front_lounge_width_offset_vs_rear_room_cm: 35  # rear room ~35 cm wider than front lounge (because hallway reduces front lounge width)
  ambiguity_flags:
    - "Proposed opening WIDTH not explicitly stated by Grahame — derived only via the 60+70 nibs and the available wall length. Confirm clear opening width with Craig."

# ---------------------------------------------------------------------
# FRONT LOUNGE / RECEPTION ROOM
